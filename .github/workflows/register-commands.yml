name: Register Discord Commands

on:
  workflow_dispatch: # Permet de lancer le script manuellement depuis l'onglet Actions

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run register script
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: node register.js
